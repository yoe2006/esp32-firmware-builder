name: Compile & Deploy Firmware — Yoefie Family

on:
  repository_dispatch:
    types: [compile-firmware]
  workflow_dispatch:

jobs:
  compile:
    name: Kompile & Upload ke Hosting
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Ambil Kode
        uses: actions/checkout@v4

      - name: 📋 Simpan Data Proyek
        id: data
        run: |
          echo "ID_PROYEK=${{ github.event.client_payload.id_proyek }}" >> $GITHUB_OUTPUT
          echo "VERSI=${{ github.event.client_payload.versi }}" >> $GITHUB_OUTPUT

      - name: 🔧 Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: 📦 Install Board ESP32
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: 📚 Install Library yang Dibutuhkan
        run: |
          arduino-cli lib install "WiFi"
          arduino-cli lib install "Arduino WebServer"
          arduino-cli lib install "HTTPClient"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "LiquidCrystal I2C"
          arduino-cli lib install "UniversalTelegramBot"
          arduino-cli lib install "ArduinoOTA"

      - name: 🔨 Kompile Firmware
        run: |
          cd esp32-firmware
          arduino-cli compile --fqbn esp32:esp32:esp32 Yoefie_Family_Switch.ino --output-dir ./build

      - name: 📤 Upload .bin ke Hosting Website
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: 21
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          source: "esp32-firmware/build/Yoefie_Family_Switch.ino.bin"
          target: "/home/sites/18a/1/1a9a52a59e/public_html/smart/firmware/"
          rename: "Yoefie_Family_Switch_v${{ steps.data.outputs.VERSI }}_id${{ steps.data.outputs.ID_PROYEK }}.bin"
          overwrite: true

      - name: ✅ Selesai
        run: |
          echo "✅ Firmware berhasil dikompile & diupload ke hosting!"
          echo "📂 Nama file: Yoefie_Family_Switch_v${{ steps.data.outputs.VERSI }}_id${{ steps.data.outputs.ID_PROYEK }}.bin"
