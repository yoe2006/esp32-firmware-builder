name: Build ESP32 Firmware

# 🎯 Kapan berjalan? — Bisa dipicu otomatis dari website!
on:
  workflow_dispatch:  # Bisa dijalankan manual
  repository_dispatch:  # Bisa dipicu dari website PHP kamu!
    types: [compile_firmware]

jobs:
  build:
    runs-on: ubuntu-latest  # Komputer Linux gratis dari GitHub

    steps:
      - name: 📂 Ambil kode dari repository
        uses: actions/checkout@v4

      - name: 🔧 Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: 📦 Install Board ESP32
        run: |
          arduino-cli config init --additional-urls https://dl.espressif.com/dl/package_esp32_index.json
          arduino-cli core install esp32:esp32

      - name: 📚 Install Library yang Dibutuhkan
        run: |
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "LiquidCrystal I2C"

      - name: 🔨 KOMPILASI FIRMWARE!
        run: |
          # Ganti bagian konfigurasi sesuai permintaan pengguna
          # (Nilai dikirim dari website)
          ssid="${{ github.event.client_payload.ssid }}"
          password="${{ github.event.client_payload.password }}"
          zona="${{ github.event.client_payload.zona }}"
          id_perangkat="${{ github.event.client_payload.id_perangkat }}"

          # Salin template & ganti bagian konfigurasi
          cp firmware_template.ino "${id_perangkat}.ino"
          sed -i "s/#define ID_ZONA \".*\"/#define ID_ZONA \"${zona}\"/" "${id_perangkat}.ino"
          sed -i "s/const char\* ssid = \".*\"/const char* ssid = \"${ssid}\";/" "${id_perangkat}.ino"
          sed -i "s/const char\* password = \".*\"/const char* password = \"${password}\";/" "${id_perangkat}.ino"

          # Kompilasi!
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir . "${id_perangkat}.ino"

      - name: 📤 Upload Hasil .bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: "*.bin"
          
